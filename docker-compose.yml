services:
  postgres:
    image: postgres:18-alpine
    container_name: rukun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rukun}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rukun_secret_password}
      POSTGRES_DB: ${DB_NAME:-rukun_pos}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - .pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rukun} -d ${DB_NAME:-rukun_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5
